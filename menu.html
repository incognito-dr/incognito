:root{--ink:#013131;--cream:#f3efe6;--paper:#f4f0e7;--gold:#d9b25a;--gold2:#a67c00;--deep:#013131;--turq:#008E87;
  --display:'Fact','Arial Black',sans-serif;--script:'JaneAusten',cursive;--body:'Inter',system-ui,sans-serif;--mono:'Space Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--body);font-weight:300;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit}
.top{max-width:552px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:max(22px,env(safe-area-inset-top)) 20px 16px}
.top .inc{display:block;width:clamp(96px,26vw,120px)}
.top .inc svg{width:100%;height:auto}
.top .inc svg *{fill:#fff}
.top .oasis{width:clamp(64px,18vw,84px)}
.top .oasis svg{width:100%;height:auto}
.top .oasis svg path{fill:#fff !important}
.sec{padding:0 12px}
@media(max-width:420px){.c-top{padding:22px 20px 16px}.menu{padding:6px 20px 22px}.c-foot{padding:16px 20px 22px}.it{padding:10px 0}.it .n{font-size:15.5px}.it .p{font-size:14.5px}}
.card{max-width:520px;margin:0 auto;background:var(--paper);color:#151a19;border-radius:22px;position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45),0 2px 0 rgba(255,255,255,.35) inset}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:url("https://res.cloudinary.com/dheiidsny/image/upload/f_auto,q_auto:eco,w_900/v1788206036/fondo_wpikqo.webp") center/cover;mix-blend-mode:multiply}
.c-top{position:relative;padding:26px 24px 18px}
.c-row{display:flex;justify-content:space-between;align-items:center;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.04em;color:#5d716c}
.c-row b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--deep);font-weight:700}
.c-title{font-family:var(--display);font-weight:900;font-size:clamp(34px,10vw,48px);line-height:.95;color:var(--deep);margin:16px 0 10px;letter-spacing:-.01em}
.c-lead{font-size:14.5px;line-height:1.6;color:#3d5c56;margin:0}
.stamp{position:absolute;right:20px;top:54px;transform:rotate(9deg);font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);border:1.5px solid var(--gold2);border-radius:6px;padding:6px 8px;line-height:1.35;text-align:center;opacity:.85;mix-blend-mode:multiply}
.perf{position:relative;height:0;border-top:2px dashed rgba(1,49,49,.28);margin:0 14px}
.menu{position:relative;padding:8px 24px 26px}
.cat{margin:26px 0 0}
.cat h3{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;letter-spacing:.01em;text-transform:uppercase;color:var(--turq);margin:0 0 12px}
.cat h3::after{content:"";display:block;width:44px;height:3px;background:var(--turq);margin-top:10px;opacity:.55}
.it{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(1,49,49,.09)}
.it:last-child{border-bottom:none}
.it .n{font-size:15px;font-weight:400;color:#151a19;line-height:1.35}
.it .n small{display:block;font-size:12px;color:#5d716c;margin-top:1px}
.it .n .l{display:block}
.it .p{font-family:var(--display);font-weight:900;font-size:14px;color:var(--deep);white-space:nowrap;letter-spacing:.01em}
.it .p.na{color:#9aa8a5;font-family:var(--body);font-weight:400}
.it.grp .n .l{padding:2px 0}
.c-foot{position:relative;padding:18px 24px 24px;border-top:1px solid rgba(1,49,49,.14)}
.c-foot p{font-size:12.5px;line-height:1.55;color:#3d5c56;margin:0 0 10px}
.c-foot a{color:var(--deep)}
.stamp2{display:none}
.datos{max-width:520px;margin:18px auto 0;padding:0 16px max(28px,env(safe-area-inset-bottom));text-align:center}
.datos p{margin:0}
.datos .d1{font-family:var(--body);font-weight:500;font-size:13px;letter-spacing:.02em;color:rgba(243,239,230,.85)}
.datos .d2{margin-top:8px;font-family:var(--display);font-weight:900;font-size:18px;color:#fff}
.datos .d2 a{text-decoration:none;border-bottom:1px solid rgba(243,239,230,.35)}
.datos .pie{margin-top:18px;font-family:var(--body);font-size:11.5px;color:rgba(243,239,230,.55);line-height:1.8}
.datos .pie a{color:var(--cream);text-decoration:none;border-bottom:1px solid rgba(243,239,230,.3)}
.stale{font-size:11.5px;color:#9aa8a5;margin-top:8px}
/* políticas */
@media(prefers-reduced-motion:no-preference){.card{animation:up .8s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}}
</style>
</head>

  const head=rows[0].map(h=>h.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));
  return rows.slice(1).filter(r=>r.some(v=>v.trim()!=='')).map(r=>{const o={}; head.forEach((h,i)=>o[h]=(r[i]||'').trim()); return o;});
}
const numOf=v=>{ let s=String(v==null?'':v).trim().toLowerCase().replace(/rd\$|\$|\s/g,''); if(!/^[\d.,]+$/.test(s)) return null; const pt=s.lastIndexOf('.'),cm=s.lastIndexOf(','); if(pt>-1&&cm>-1) s= pt>cm? s.replace(/,/g,'') : s.replace(/\./g,'').replace(',','.'); else if(cm>-1) s=/^\d{1,3}(,\d{3})+$/.test(s)? s.replace(/,/g,'') : s.replace(',','.'); else if(pt>-1&&/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,''); if(!/^\d+(\.\d+)?$/.test(s)) return null; return Math.round(parseFloat(s)); };
function render(filas){
  const cats=[]; const byCat={};
  filas.forEach(f=>{ if(String(f.visible||'').toLowerCase()==='no') return; const c=f.categoria||'Otros'; if(!byCat[c]){ byCat[c]=[]; cats.push(c);} byCat[c].push(f); });
  $('#menu').innerHTML=cats.map(c=>{
    const items=byCat[c]; const out=[]; let i=0;
    while(i<items.length){
      const f=items[i];
      if(f.grupo){ const g=[]; while(i<items.length && items[i].grupo===f.grupo){ g.push(items[i]); i++; }
        const p=numOf(g[0].precio);
        out.push(`<div class="it grp"><div class="n">${g.map(x=>'<span class="l">'+esc(x.producto)+(x.detalle?' <small style="display:inline">· '+esc(x.detalle)+'</small>':'')+'</span>').join('')}</div><div class="p ${p?'':'na'}">${p?fmt(p):'—'}</div></div>`);
      } else { const p=numOf(f.precio); i++;
        out.push(`<div class="it"><div class="n">${esc(f.producto)}${f.detalle?'<small>'+esc(f.detalle)+'</small>':''}</div><div class="p ${p?'':'na'}">${p?fmt(p):'—'}</div></div>`); }
    }
    return `<div class="cat"><h3>${esc(c)}</h3>${out.join('')}</div>`;
  }).join('');
}
/* v2 · 1) pinta al instante: caché del teléfono (última lectura del Sheet) o la lista embebida */
const CACHE='oasisMenu';
let actual=BASE;
try{ const c=JSON.parse(localStorage.getItem(CACHE)||'null'); if(c && Array.isArray(c.rows) && c.rows.length && 'producto' in c.rows[0]){ actual=c.rows; } }catch(_){}
render(actual);
/* 2) refresca en silencio desde el Sheet; solo repinta si algo cambió */
(async function(){
  if(!SCRIPT_URL) return;
  try{
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),9000);
    const r=await fetch(SCRIPT_URL+'?tab=menu&_='+Date.now(),{signal:ctrl.signal,cache:'no-store'}); clearTimeout(t);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows=parseCSV(await r.text());
    if(rows.length && 'producto' in rows[0]){
      if(JSON.stringify(rows)!==JSON.stringify(actual)) render(rows);
      try{ localStorage.setItem(CACHE,JSON.stringify({rows,t:Date.now()})); }catch(_){}
      document.documentElement.dataset.menu='sheet:'+rows.length;
    }
  }catch(e){ document.documentElement.dataset.menu='local'; }
})();
setInterval(()=>{ if(document.visibilityState==='visible') location.reload(); }, 10*60*1000);
</script>
